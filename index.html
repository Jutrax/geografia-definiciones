<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geografía — Definiciones</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --ink: #1f2a44;
    --muted: #6b7794;
    --line: #e1e7f0;
    --accent: #4f6bed;
    --accent-soft: #e8ecff;
    --ok: #1f9d63;
    --ok-soft: #e0f6ec;
    --bad: #d64545;
    --bad-soft: #fde6e6;
    --shadow: 0 8px 30px rgba(31, 42, 68, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a2b; --card: #1d2640; --ink: #e8ecf7; --muted: #9aa6c4; --line: #2e3a5c;
      --accent: #7c93ff; --accent-soft: #28345c; --ok: #4fd69a; --ok-soft: #17382c;
      --bad: #ff7b7b; --bad-soft: #3e2023; --shadow: 0 8px 30px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 {
    text-align: center;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    letter-spacing: .08em;
    margin: 8px 0 18px;
  }
  .tabs {
    display: flex; flex-wrap: wrap; gap: 8px; background: var(--card);
    padding: 6px; border-radius: 16px; box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .tab {
    flex: 1 1 30%; min-width: 0; border: 0; background: transparent; color: var(--muted);
    padding: 12px 6px; border-radius: 12px; font-size: .95rem; font-weight: 600;
    cursor: pointer; transition: all .2s;
  }
  .tab:hover { background: var(--accent-soft); }
  .tab.active { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(79,107,237,.35); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat {
    background: var(--card); border-radius: 14px; padding: 10px 6px;
    text-align: center; box-shadow: var(--shadow);
  }
  .stat b { display: block; font-size: 1.4rem; }
  .stat span { font-size: .72rem; color: var(--muted); }
  .stat.ok b { color: var(--ok); }
  .stat.bad b { color: var(--bad); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 8px 14px; border-radius: 999px; font-size: .88rem; cursor: pointer;
    transition: all .2s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .nav label { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
  .nav select {
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 10px; font-size: .9rem; cursor: pointer;
  }
  .chip:disabled { opacity: .4; cursor: default; }
  body.reviewing .nav { display: none; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); }
  .done p { color: var(--muted); margin: -8px 0 20px; }
  .lbl { align-self: center; font-size: .85rem; color: var(--muted); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .hard-toggle {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    font-size: .85rem; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; transition: all .2s;
  }
  .hard-toggle:hover { border-color: var(--bad); }
  .hard-toggle.on { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .hard-toggle input { accent-color: var(--bad); width: 16px; height: 16px; margin: 0; cursor: pointer; }
  #review { display: none; }
  body.reviewing #review { display: block; }
  body.reviewing #card, body.reviewing .progress, body.reviewing .qnum { display: none; }
  .rv-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .rv-row {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; cursor: pointer;
    border-top: 1px solid var(--line);
  }
  .rv-row input { accent-color: var(--bad); width: 18px; height: 18px; margin: 3px 0 0; flex: none; cursor: pointer; }
  .rv-row b { display: block; }
  .rv-row span { display: block; font-size: .85rem; color: var(--muted); }
  .rv-empty { color: var(--muted); text-align: center; padding: 12px 0; }
  .chip.danger:hover { border-color: var(--bad); color: var(--bad); }

  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #7c93ff); transition: width .4s; }
  .qnum { color: var(--muted); font-size: .88rem; margin-bottom: 12px; display: flex; justify-content: space-between; }

  .card {
    background: var(--card); border-radius: 22px; padding: clamp(20px, 5vw, 36px);
    box-shadow: var(--shadow); animation: pop .35s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .group { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
  .definition {
    font-size: clamp(1.1rem, 3.2vw, 1.5rem); line-height: 1.55; margin: 10px 0 24px;
    font-weight: 500; text-align: center;
  }
  .options { display: grid; gap: 10px; }
  .opt {
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 14px; padding: 14px 16px; font-size: 1rem; text-align: left;
    cursor: pointer; transition: all .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); transform: translateX(3px); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 700; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .answer-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .answer-row input {
    flex: 1; min-width: 180px; padding: 14px 16px; font-size: 1rem; background: var(--card); color: var(--ink);
    border: 2px solid var(--line); border-radius: 14px; outline: none; transition: border-color .2s;
  }
  .answer-row input:focus { border-color: var(--accent); }
  .btn {
    border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 1rem;
    padding: 14px 22px; border-radius: 14px; cursor: pointer; transition: all .15s;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn.secondary { background: var(--accent-soft); color: var(--accent); }

  .feedback { margin-top: 18px; font-weight: 700; font-size: 1.05rem; min-height: 1.5em; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .next { margin-top: 16px; text-align: right; }
  .pic { margin: 18px 0 0; text-align: center; animation: pop .4s ease; }
  .pic img { max-width: 100%; max-height: 320px; border-radius: 14px; background: var(--accent-soft); }
  .pic figcaption { margin-top: 6px; font-size: .8rem; color: var(--muted); }
  .pic figcaption a { color: inherit; }

  .done { text-align: center; }
  .done h2 { font-size: 1.8rem; margin: 0 0 16px; }
  .done .stats { margin: 16px 0 22px; grid-template-columns: repeat(3, 1fr); }
  .empty { text-align: center; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GEOGRAFÍA — DEFINICIONES</h1>

  <div class="tabs">
    <button class="tab" id="tab-test">Fase 1: Test</button>
    <button class="tab" id="tab-write">Fase 2: Escribir</button>
    <button class="tab" id="tab-hard">Fase 3: Difíciles (<span id="hard-count">0</span>)</button>
  </div>

  <div class="stats">
    <div class="stat ok"><b id="s-ok">0</b><span>Acertadas</span></div>
    <div class="stat bad"><b id="s-bad">0</b><span>Falladas</span></div>
    <div class="stat"><b id="s-pct">0%</b><span>Aciertos</span></div>
    <div class="stat"><b id="s-total">0</b><span>Respondidas</span></div>
  </div>

  <div class="toolbar">
    <button class="chip" id="btn-failed">Solo falladas (<span id="failed-count">0</span>)</button>
    <button class="chip" id="btn-round">Nueva ronda</button>
    <button class="chip" id="btn-review">Revisar acertadas y falladas</button>
    <button class="chip danger" id="btn-reset">Reiniciar estadísticas</button>
  </div>

  <div class="toolbar">
    <span class="lbl">Tema:</span>
    <button class="chip" data-topic="all">Mezclar ambos</button>
    <button class="chip" data-topic="Generales">Generales</button>
    <button class="chip" data-topic="Tema relieve">Relieve</button>
    <button class="chip" id="btn-pics">Fotos: sí</button>
    <button class="chip" id="btn-time">Cronómetro: no</button>
  </div>
  <div class="toolbar hidden" id="hard-format">
    <span class="lbl">Fase 3 en formato:</span>
    <button class="chip" data-hfmt="test">Test</button>
    <button class="chip" data-hfmt="write">Escribir</button>
  </div>

  <div class="progress"><div id="bar"></div></div>
  <div class="qnum"><span id="qnum"></span><span id="timer"></span><span id="qprog"></span></div>

  <div class="card" id="card"></div>
  <div class="nav hidden" id="nav">
    <button class="chip" id="btn-prev">← Anterior</button>
    <label>Ir a la pregunta <select id="jump"></select></label>
    <button class="chip" id="btn-fwd">Siguiente →</button>
  </div>
  <div class="card" id="review"></div>
</div>

const KEY = "geo-defs-v1";
const $ = id => document.getElementById(id);

// ---------- Estado ----------
let S = { mode: "test", topic: "all", showPics: true, timed: false, hardFormat: "test", hard: [], right: [], onlyFailed: false, ok: 0, bad: 0, failed: [],
          round: { queue: [], idx: 0, ok: 0, bad: 0, time: 0, timedN: 0, res: {}, last: null, done: false } };
let answered = false;   // ¿la pregunta actual ya se ha respondido?
let options = [];       // opciones de la pregunta actual (Fase 1)

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && typeof raw === "object") {
      S = Object.assign(S, raw);
      S.round = Object.assign({ queue: [], idx: 0, ok: 0, bad: 0, time: 0, timedN: 0, res: {}, last: null, done: false }, raw.round);
    }
  } catch (e) { /* sin localStorage: se sigue sin guardar */ }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- Utilidades ----------
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9ñ ]/g, " ").replace(/\s+/g, " ").trim();
}
const byId = id => DEFS[id];

// ---------- Cronómetro (opcional) ----------
let tInt = null, tStart = 0, tAcc = 0, tRunning = false, tActive = false;
const fmtT = ms => (ms / 1000).toFixed(1).replace(".", ",") + " s";
function timerShow() { $("timer").textContent = "⏱ " + fmtT(tAcc + (tRunning ? performance.now() - tStart : 0)); }
function timerReset() { clearInterval(tInt); tInt = null; tRunning = false; tActive = false; tAcc = 0; $("timer").textContent = ""; }
function timerPause() { if (!tRunning) return; tAcc += performance.now() - tStart; tRunning = false; clearInterval(tInt); }
function timerResume() {
  if (!tActive || tRunning || document.hidden || document.body.classList.contains("reviewing")) return;
  tStart = performance.now(); tRunning = true; tInt = setInterval(timerShow, 100); timerShow();
}
function timerStop() { timerPause(); tActive = false; return tAcc; }
document.addEventListener("visibilitychange", () => document.hidden ? timerPause() : timerResume());

// Formato de pregunta que toca: la Fase 3 usa el formato elegido aparte
const fmt = () => S.mode === "hard" ? S.hardFormat : S.mode;

// ---------- Rondas ----------
function pool() {
  let p = DEFS.filter(d => S.topic === "all" || d.group === S.topic);
  if (S.onlyFailed) p = p.filter(d => S.failed.includes(d.id));
  if (S.mode === "hard") p = p.filter(d => S.hard.includes(d.id));
  return p.map(d => d.id);
}

function newRound() {
  let q = shuffle(pool());
  // Evitar repetir la última definición vista justo al empezar
  if (q.length > 1 && q[0] === S.round.last) {
    const k = 1 + Math.floor(Math.random() * (q.length - 1));
    [q[0], q[k]] = [q[k], q[0]];
  }
  S.round = { queue: q, idx: 0, ok: 0, bad: 0, time: 0, timedN: 0, res: {}, last: S.round.last, done: false };
  save();
  render();
}

function currentQ() { return byId(S.round.queue[S.round.idx]); }

// ---------- Render ----------
function renderStats() {
  const total = S.ok + S.bad;
  $("s-ok").textContent = S.ok;
  $("s-bad").textContent = S.bad;
  $("s-pct").textContent = total ? Math.round(S.ok / total * 100) + "%" : "0%";
  $("s-total").textContent = total;
  $("failed-count").textContent = S.failed.length;
  $("btn-failed").classList.toggle("on", S.onlyFailed);
  $("hard-count").textContent = S.hard.length;
  $("tab-test").classList.toggle("active", S.mode === "test");
  $("tab-write").classList.toggle("active", S.mode === "write");
  $("tab-hard").classList.toggle("active", S.mode === "hard");
  $("hard-format").classList.toggle("hidden", S.mode !== "hard");
  document.querySelectorAll("[data-hfmt]").forEach(b => b.classList.toggle("on", b.dataset.hfmt === S.hardFormat));
  document.querySelectorAll("[data-topic]").forEach(b => b.classList.toggle("on", b.dataset.topic === S.topic));
  $("btn-pics").classList.toggle("on", S.showPics);
  $("btn-pics").textContent = "Fotos: " + (S.showPics ? "sí" : "no");
  $("btn-time").classList.toggle("on", S.timed);
  $("btn-time").textContent = "Cronómetro: " + (S.timed ? "sí" : "no");
}

function renderProgress() {
  const n = S.round.queue.length;
  const done = Object.keys(S.round.res).length;
  $("bar").style.width = (n ? done / n * 100 : 0) + "%";
  $("qnum").textContent = (!S.round.done && n) ? "Pregunta " + (S.round.idx + 1) : "";
  $("qprog").textContent = n ? done + " / " + n + (S.onlyFailed ? " (solo falladas)" : "") : "";
}

function renderNav() {
  const r = S.round, n = r.queue.length;
  const sel = $("jump");
  sel.innerHTML = "";
  r.queue.forEach((id, i) => {
    const o = document.createElement("option"), res = r.res[id];
    o.value = i; o.textContent = (i + 1) + (res ? (res.ok ? " ✓" : " ✗") : "");
    sel.append(o);
  });
  sel.value = r.idx;
  $("btn-prev").disabled = r.idx <= 0;
  $("btn-fwd").disabled = r.idx >= n - 1;
  $("nav").classList.remove("hidden");
}

function render() {
  answered = false;
  $("nav").classList.add("hidden");
  timerReset();
  document.body.classList.remove("reviewing");
  $("btn-review").classList.remove("on");
  renderStats();
  const card = $("card");
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  card.innerHTML = "";

  if (!S.round.queue.length) {
    let title = "No hay preguntas con estos filtros", hint = "Cambia el tema o desactiva «Solo falladas».";
    if (S.mode === "hard" && !S.hard.length) {
      title = "Aún no has marcado ninguna como difícil";
      hint = "Marca la casilla «Difícil» mientras practicas en las fases 1 o 2 y aparecerán aquí.";
    } else if (S.onlyFailed && !S.failed.length) {
      title = "No tienes preguntas falladas 🎉"; hint = "Desactiva «Solo falladas» para practicar todas.";
    }
    card.innerHTML = '<div class="empty"><h2></h2><p></p></div>';
    card.querySelector("h2").textContent = title;
    card.querySelector("p").textContent = hint;
    renderProgress();
    return;
  }
  if (S.round.done || S.round.idx >= S.round.queue.length) { renderDone(); return; }

  const q = currentQ();
  if (q.pic && S.showPics) new Image().src = q.pic[0];
  const head = document.createElement("div"); head.className = "head";
  const g = document.createElement("div"); g.className = "group"; g.textContent = q.group;
  const hl = document.createElement("label"); hl.className = "hard-toggle";
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "hard-cb";
  cb.checked = S.hard.includes(q.id);
  hl.classList.toggle("on", cb.checked);
  cb.onchange = () => {
    S.hard = S.hard.filter(x => x !== q.id);
    if (cb.checked) S.hard.push(q.id);
    hl.classList.toggle("on", cb.checked);
    save(); renderStats();
  };
  hl.append(cb, "Difícil");
  head.append(g, hl);
  const d = document.createElement("div"); d.className = "definition"; d.textContent = q.definition;
  card.append(head, d);

  const prev = S.round.res[q.id];
  if (fmt() === "test") renderTest(card, q, prev); else renderWrite(card, q, prev);

  const fb = document.createElement("div"); fb.className = "feedback"; fb.id = "fb";
  const nx = document.createElement("div"); nx.className = "next hidden"; nx.id = "next";
  const btn = document.createElement("button"); btn.className = "btn"; btn.id = "btn-next";
  const last = S.round.queue.every(id => id === q.id || S.round.res[id]);
  btn.textContent = last ? "Ver resultado" : "Siguiente";
  btn.onclick = next;
  nx.append(btn);
  card.append(fb, nx);
  if (prev) {
    answered = true;
    feedback(prev.ok, q);
    showPic(q);
    nx.classList.remove("hidden");
  }
  renderNav();
  renderProgress();
  if (S.timed && !prev) { tActive = true; timerResume(); }
}

function renderTest(card, q, prev) {
  if (prev && prev.opts) options = prev.opts.map(byId);
  else options = shuffle([q, ...shuffle(DEFS.filter(x => x.id !== q.id)).slice(0, 3)]);
  const box = document.createElement("div"); box.className = "options";
  options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o.concept; b.dataset.id = o.id;
    b.onclick = () => answerTest(o.id, box);
    box.append(b);
  });
  if (prev) box.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (+b.dataset.id === q.id) b.classList.add("correct");
    else if (+b.dataset.id === prev.pick) b.classList.add("wrong");
  });
  card.append(box);
}

function renderWrite(card, q, prev) {
  const row = document.createElement("div"); row.className = "answer-row";
  const inp = document.createElement("input");
  inp.type = "text"; inp.id = "inp"; inp.placeholder = "Escribe el concepto…";
  inp.autocomplete = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;
  const b = document.createElement("button"); b.className = "btn"; b.id = "btn-check"; b.textContent = "Comprobar";
  b.onclick = checkWrite;
  row.append(inp, b);
  card.append(row);
  if (prev) {
    inp.value = prev.pick; inp.disabled = true; b.disabled = true;
    inp.style.borderColor = prev.ok ? "var(--ok)" : "var(--bad)";
  } else setTimeout(() => inp.focus(), 50);
}

function renderDone() {
  const r = S.round, t = r.ok + r.bad;
  const pct = t ? Math.round(r.ok / t * 100) : 0;
  $("card").innerHTML =
    '<div class="done"><h2>¡Ronda completada! 🎉</h2>' +
    '<div class="stats"><div class="stat ok"><b>' + r.ok + '</b><span>Aciertos</span></div>' +
    '<div class="stat bad"><b>' + r.bad + '</b><span>Fallos</span></div>' +
    '<div class="stat"><b>' + pct + '%</b><span>Porcentaje</span></div></div>' +
    (r.timedN ? '<p>Tiempo medio: ' + fmtT(r.time / r.timedN) + ' por pregunta · Total: ' + fmtT(r.time) + '</p>' : '') +
    '<button class="btn" id="btn-again">Nueva ronda</button></div>';
  $("btn-again").onclick = newRound;
  $("bar").style.width = "100%";
  $("qnum").textContent = "";
  $("qprog").textContent = r.queue.length + " / " + r.queue.length;
}

// ---------- Respuestas ----------
function record(correct, id, pick) {
  answered = true;
  S.round.res[id] = { ok: correct, pick, opts: fmt() === "test" ? options.map(o => o.id) : undefined };
  if (tActive) {
    const el = timerStop();
    S.round.time += el; S.round.timedN++;
    $("timer").textContent = "⏱ " + fmtT(el);
  }
  if (correct) {
    S.ok++; S.round.ok++;
    S.failed = S.failed.filter(x => x !== id);
    if (!S.right.includes(id)) S.right.push(id);
  } else {
    S.bad++; S.round.bad++;
    S.right = S.right.filter(x => x !== id);
    if (!S.failed.includes(id)) S.failed.push(id);
  }
  S.round.last = id;
  save();
  renderStats();
  renderProgress();
  showPic(byId(id));
  $("next").classList.remove("hidden");
  $("btn-next").focus();
}

function showPic(q) {
  if (!q.pic || !S.showPics) return;
  const fig = document.createElement("figure"); fig.className = "pic";
  const img = document.createElement("img");
  img.src = q.pic[0]; img.alt = q.concept;
  img.onerror = () => fig.remove();
  const cap = document.createElement("figcaption");
  cap.append(q.concept + " · Foto: ");
  const a = document.createElement("a");
  a.href = q.pic[1]; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Wikimedia Commons";
  cap.append(a);
  fig.append(img, cap);
  $("card").insertBefore(fig, $("next"));
}

function feedback(ok, q) {
  const fb = $("fb");
  fb.className = "feedback " + (ok ? "ok" : "bad");
  fb.textContent = ok ? "¡Correcto!" : "Incorrecto. La respuesta correcta es: " + q.concept;
}

function answerTest(chosenId, box) {
  if (answered) return;
  const q = currentQ();
  const ok = chosenId === q.id;
  box.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (+b.dataset.id === q.id) b.classList.add("correct");
    else if (+b.dataset.id === chosenId) b.classList.add("wrong");
  });
  feedback(ok, q);
  record(ok, q.id, chosenId);
}

function checkWrite() {
  if (answered) return;
  const inp = $("inp");
  if (!inp.value.trim()) { inp.focus(); return; }
  const q = currentQ();
  const ok = norm(inp.value) === norm(q.concept);
  inp.disabled = true;
  $("btn-check").disabled = true;
  inp.style.borderColor = ok ? "var(--ok)" : "var(--bad)";
  feedback(ok, q);
  record(ok, q.id, inp.value);
}

function goTo(i) {
  if (i < 0 || i >= S.round.queue.length) return;
  S.round.idx = i; save(); render();
}

function next() {
  const r = S.round, n = r.queue.length;
  if (r.idx + 1 < n) { goTo(r.idx + 1); return; }
  const pending = r.queue.findIndex(id => !r.res[id]);
  if (pending >= 0) { goTo(pending); return; }
  r.idx = n; r.done = true; save(); render();
}

// ---------- Revisión ----------
let reviewTab = "failed";

function renderReview() {
  renderStats();
  const box = $("review");
  box.innerHTML = "";
  const ids = (reviewTab === "failed" ? S.failed : S.right).filter(id => byId(id));

  const head = document.createElement("div"); head.className = "rv-head";
  const tabs = document.createElement("div"); tabs.className = "toolbar"; tabs.style.margin = "0";
  [["failed", "Falladas (" + S.failed.length + ")"], ["right", "Acertadas (" + S.right.length + ")"]].forEach(([k, label]) => {
    const b = document.createElement("button"); b.className = "chip" + (reviewTab === k ? " on" : ""); b.textContent = label;
    b.onclick = () => { reviewTab = k; renderReview(); };
    tabs.append(b);
  });
  head.append(tabs);

  if (ids.length) {
    const all = document.createElement("label"); all.className = "hard-toggle";
    const cbAll = document.createElement("input"); cbAll.type = "checkbox";
    cbAll.checked = ids.every(id => S.hard.includes(id));
    all.classList.toggle("on", cbAll.checked);
    cbAll.onchange = () => {
      S.hard = S.hard.filter(x => !ids.includes(x));
      if (cbAll.checked) S.hard.push(...ids);
      save(); renderReview();
    };
    all.append(cbAll, "Marcar todas como difíciles");
    head.append(all);
  }
  box.append(head);

  if (!ids.length) {
    const e = document.createElement("div"); e.className = "rv-empty";
    e.textContent = reviewTab === "failed" ? "No tienes ninguna fallada." : "Todavía no has acertado ninguna.";
    box.append(e);
    return;
  }
  ids.map(byId).sort((a, b) => a.concept.localeCompare(b.concept, "es")).forEach(d => {
    const row = document.createElement("label"); row.className = "rv-row";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = S.hard.includes(d.id);
    cb.onchange = () => {
      S.hard = S.hard.filter(x => x !== d.id);
      if (cb.checked) S.hard.push(d.id);
      save(); renderReview();
    };
    const txt = document.createElement("div");
    const b = document.createElement("b"); b.textContent = d.concept;
    const sp = document.createElement("span"); sp.textContent = d.definition;
    txt.append(b, sp);
    row.append(cb, txt);
    box.append(row);
  });
}

function toggleReview() {
  if (document.body.classList.contains("reviewing")) { document.body.classList.remove("reviewing"); $("btn-review").classList.remove("on"); timerResume(); return; }
  document.body.classList.add("reviewing"); $("btn-review").classList.add("on");
  timerPause();
  renderReview();
}

// ---------- Eventos ----------
function setMode(m) {
  const involvesHard = m === "hard" || S.mode === "hard";
  S.mode = m;
  if (involvesHard) newRound(); else { save(); render(); }
}
$("tab-test").onclick = () => setMode("test");
$("tab-write").onclick = () => setMode("write");
$("tab-hard").onclick = () => setMode("hard");
$("btn-review").onclick = toggleReview;
$("btn-prev").onclick = () => goTo(S.round.idx - 1);
$("btn-fwd").onclick = () => goTo(S.round.idx + 1);
$("jump").onchange = e => goTo(+e.target.value);
$("btn-time").onclick = () => {
  S.timed = !S.timed; save(); renderStats();
  if (!S.timed) { timerReset(); }
  else if (!answered && $("btn-next")) { tActive = true; tAcc = 0; timerResume(); }
};

document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { S.topic = b.dataset.topic; newRound(); });
document.querySelectorAll("[data-hfmt]").forEach(b => b.onclick = () => { S.hardFormat = b.dataset.hfmt; newRound(); });
$("btn-pics").onclick = () => {
  S.showPics = !S.showPics; save(); renderStats();
  document.querySelectorAll(".pic").forEach(p => p.remove());
  if (S.showPics && answered && !S.round.done) showPic(currentQ());
};

$("btn-failed").onclick = () => { S.onlyFailed = !S.onlyFailed; newRound(); };
$("btn-round").onclick = newRound;
let resetTimer = null;
$("btn-reset").onclick = () => {
  const b = $("btn-reset");
  if (!resetTimer) {
    b.textContent = "¿Seguro? Pulsa otra vez";
    resetTimer = setTimeout(() => { b.textContent = "Reiniciar estadísticas"; resetTimer = null; }, 4000);
    return;
  }
  clearTimeout(resetTimer); resetTimer = null; b.textContent = "Reiniciar estadísticas";
  S.ok = 0; S.bad = 0; S.failed = []; S.right = []; S.onlyFailed = false; S.round.last = null;
  newRound();
};

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || document.body.classList.contains("reviewing")) return;
  if (fmt() === "write" && !S.round.done && S.round.queue.length) {
    e.preventDefault();
    if (!answered) checkWrite(); else next();
  } else if (answered && document.activeElement.id !== "btn-next") {
    next();
  }
});

// ---------- Inicio ----------
load();
const valid = S.round.queue.length && S.round.queue.every(id => byId(id));
if (valid) render(); else newRound();
</script>
</body>
